# /etc/nginx/sites-available/tinurik-frontend
# Barangay Tinurik Portal - Nginx Reverse Proxy & Static SPA Server
# Deployed on AWS EC2 Instance 1 (tinurik-frontend)

server {
    listen 80;
    listen [::]:80;
    server_name _; # Or your domain e.g. portal.tinurik.gov.ph or EC2 Public IP

    # Root directory where built Vite React app files reside
    root /var/www/tinurik-frontend/dist;
    index index.html index.htm;

    # Gzip Compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend Single Page Application (SPA) routing
    # Routes all client-side paths back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # (Optional) Reverse Proxy to Backend EC2 Instance 2:
    # If you prefer routing API calls through the Nginx reverse proxy instead of direct port 5000:
    # location /api/ {
    #     proxy_pass http://<EC2_BACKEND_PRIVATE_OR_PUBLIC_IP>:5000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Health Check Endpoint for AWS Application Load Balancer (ALB)
    location /health {
        access_log off;
        return 200 "Frontend EC2 Instance Healthy\n";
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
